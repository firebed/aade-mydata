name: PHP Composer

on:
  push:
    branches: [ "5.x", "6.x" ]
  pull_request:
    branches: [ "5.x", "6.x" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
        guzzle: [ '^7.8', '^8.0' ]

    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }}

    steps:
    - uses: actions/checkout@v4

    # The runner's system PHP lags behind on patch releases, and
    # roave/security-advisories refuses to install on a PHP with known advisories.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-guzzle-${{ matrix.guzzle }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-guzzle-${{ matrix.guzzle }}-

    - name: Pin Guzzle ${{ matrix.guzzle }}
      run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Code style (Pint)
      run: composer run-script lint

    # The PHPDoc types follow the locked Guzzle 8 (HandlerStack is generic there, not in 7);
    # the Guzzle 7 jobs are covered by the test suite.
    - name: Static analysis (PHPStan)
      if: matrix.guzzle == '^8.0'
      run: composer run-script analyse

    - name: Run test suite
      run: composer run-script test
