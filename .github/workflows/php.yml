name: PHP Composer

on:
  push:
    branches: [ "4.x", "5.x" ]
  pull_request:
    branches: [ "4.x", "5.x" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4

    # The runner's system PHP lags behind on patch releases, and
    # roave/security-advisories refuses to install on a PHP with known advisories.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    # PHP 8.1 is end-of-life, so roave/security-advisories conflicts with every
    # 8.1 release. It is a dev-only dependency, so dropping it here does not
    # change what library users install; it only lets us keep testing ^8.1.
    - name: Remove roave/security-advisories (EOL PHP)
      if: matrix.php == '8.1'
      run: composer remove --dev roave/security-advisories --no-update --no-interaction

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run test suite
      run: composer run-script test
